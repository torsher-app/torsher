name: Image

# Publishes the image only for a release tag. A manual run builds both
# architectures without pushing, to check the Dockerfile
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # The product version is the server package version: a tag that does
      # not match it would show a wrong version and a false update in the panel
      - id: version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./apps/server/package.json').version")
          if [ "$tag" != "$package" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/server/package.json ($package)" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The build itself runs natively; only the runtime stage of the other
      # architecture needs emulation
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # `latest`, `X.Y` and `X` follow stable releases only; `beta` follows
      # every release, so the beta channel also gets stable versions
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=beta,enable=${{ github.ref_type == 'tag' }}

      - if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TORSHER_VERSION=${{ steps.version.outputs.version }}
            TORSHER_COMMIT=${{ github.sha }}
          # TMDB app key for the catalog. Without the secret (forks) the input
          # stays empty and the image has no app key. The secret is not part
          # of the cache key, so its stage is always rebuilt
          secrets: ${{ secrets.TMDB_APP_TOKEN && format('tmdb_app_key={0}', secrets.TMDB_APP_TOKEN) || '' }}
          no-cache-filters: tmdb-app-key
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The release appears only after the image is published: servers learn
  # about a new version from releases, and `docker compose pull` must
  # already find it. A separate job keeps write access to the repository
  # away from the image build
  release:
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.image.outputs.version }}
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
        run: |
          # A rerun of the same tag keeps the release that is already there
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if (index($0, version)) { found = 1; next } }
            found { print }
          ' apps/server/CHANGELOG.md > notes.md 2>/dev/null || true
          flags=""
          if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $flags
          fi
