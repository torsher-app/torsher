name: Docker Hub

# Copies a published version from GHCR to Docker Hub without rebuilding it:
# the same digest, the attestations stored in its index and the signature of
# the release workflow, so one `cosign verify` works for both registries.
# A manual run copies a version that is already out
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to copy, for example 1.0.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  copy:
    if: vars.DOCKERHUB_IMAGE != ''
    runs-on: ubuntu-latest
    env:
      SOURCE: ghcr.io/${{ github.repository }}
      TARGET: ${{ vars.DOCKERHUB_IMAGE }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the tags that point at this version in GHCR right now: copying an
      # older version must not move `latest` back
      - run: |
          digest_of() {
            docker buildx imagetools inspect "$SOURCE:$1" --format '{{json .Manifest}}' 2> /dev/null | jq -r .digest
          }
          digest=$(digest_of "$VERSION")
          if [ -z "$digest" ]; then
            echo "$SOURCE:$VERSION is not published" >&2
            exit 1
          fi
          major_minor=${VERSION%.*}
          for tag in "$VERSION" "$major_minor" "${major_minor%.*}" latest beta; do
            if [ "$(digest_of "$tag")" = "$digest" ]; then
              cosign copy --force "$SOURCE@$digest" "$TARGET:$tag"
              echo "$TARGET:$tag" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - run: |
          copied=$(docker buildx imagetools inspect "$TARGET:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          source=$(docker buildx imagetools inspect "$SOURCE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$copied" != "$source" ]; then
            echo "$TARGET:$VERSION is $copied, not $source" >&2
            exit 1
          fi
          cosign verify "$TARGET:$VERSION" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
