name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm --filter @torsher/tv-shell-webos build

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @torsher/site check

      - run: pnpm --filter @torsher/site build

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engine:
              - 'engine/**'
              - '.github/workflows/ci.yml'
            android:
              - 'apps/tv-shell-android/**'
              - 'apps/server/package.json'
              - 'packages/i18n/**'
              - 'packages/tokens/**'
              - '.github/workflows/ci.yml'

  engine:
    needs: changes
    # On main it always runs so engine flakiness stays visible; !cancelled() keeps it
    # from being skipped along with the PR-only changes job.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test -race ./...

      - run: CGO_ENABLED=0 go build -o /dev/null .

  android:
    needs: changes
    # Same as the engine: always on main, on PRs only when the app changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv-shell-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.2 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
