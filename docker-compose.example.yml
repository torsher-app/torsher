# docker-compose.yml for Torsher. Adjust the values below, then start it:
#
#   docker compose up -d                        # Torsher only
#   docker compose --profile prowlarr up -d     # Torsher and Prowlarr
#
# Then open http://<host>:8080/panel/ to create the owner account.

services:
  torsher:
    image: ghcr.io/torsher-app/torsher:latest
    container_name: torsher
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # Owner of the files in /data on the host (`id -u` and `id -g`)
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      # Optional: key that encrypts indexer API keys in the database.
      # Without it a key file is created in /data/db. Keep it with your backups
      # TORSHER_SECRET: change-me
      # Optional: your own TMDB API Read Access Token for the catalog instead
      # of the app key built into the image
      # TMDB_ACCESS_TOKEN:
      # Behind a reverse proxy: its address or subnet, so that sign-in
      # attempt limits see real client addresses. Don't set it without a proxy
      # TRUST_PROXY: 172.18.0.0/16
    volumes:
      # One disk (recommended): database, keys, downloads (/data/torrents)
      # and the library (/data/library) in one volume. Files you keep are
      # hard-linked from downloads to the library and take no extra space
      - ./data:/data
      # Several disks: keep /data above for the database, mount the big disk
      # once and choose /storage/torrents and /storage/library in
      # Settings → Storage. Keep both folders in this one volume: two
      # volumes, even on one disk, turn hard links into copies
      # - /mnt/big:/storage
      # Optional: your existing media folders, read-only
      # - /path/to/movies:/media/movies:ro
    # Optional: hardware transcoding on Intel or AMD graphics (VAAPI)
    # devices:
    #   - /dev/dri:/dev/dri
    # Optional: hardware transcoding on an NVIDIA GPU (NVENC). Needs the
    # NVIDIA driver and the NVIDIA Container Toolkit on the host
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Optional: any Torznab indexer works. Prowlarr starts empty: you add
  # the indexers you are allowed to use. The Torsher setup wizard finds it
  # at http://prowlarr:9696 and asks only for its API key
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    profiles: [prowlarr]
    ports:
      - '9696:9696'
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
    volumes:
      - ./prowlarr:/config
